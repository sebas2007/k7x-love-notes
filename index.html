<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>for you ♥</title>
<style>
  :root {
    --cream: #fdf6f0;
    --blush: #f4c6cf;
    --rose: #d9707f;
    --ink: #4a3b3f;
    --soft: #8c7377;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(circle at 15% 10%, #fde3e8 0, transparent 40%),
      radial-gradient(circle at 85% 90%, #f9d8c8 0, transparent 40%),
      var(--cream);
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    user-select: none;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 28px;
    padding: 18px 18px 26px;
    box-shadow: 0 18px 40px rgba(120, 70, 80, 0.14), 0 2px 6px rgba(120, 70, 80, 0.08);
    text-align: center;
    animation: rise 0.9s ease both;
  }
  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(160deg, var(--blush), #f9e4d9);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .frame img.show { opacity: 1; }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--rose);
    font-size: 15px;
    gap: 10px;
  }
  .placeholder .heart { font-size: 46px; animation: beat 1.6s ease-in-out infinite; }
  .caption {
    margin-top: 22px;
    min-height: 3.2em;
    font-size: 20px;
    line-height: 1.5;
    font-style: italic;
    color: var(--ink);
    transition: opacity 0.4s ease;
  }
  .caption.fade { opacity: 0; }
  .footer {
    margin-top: 18px;
    font-size: 13px;
    color: var(--soft);
    letter-spacing: 0.02em;
  }
  .hint {
    margin-top: 6px;
    font-size: 12px;
    color: #b9a3a7;
  }
  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 18px;
    color: var(--rose);
    opacity: 0;
    animation: float 2.2s ease-out forwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.12); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.08); }
  }
  @keyframes float {
    0%   { opacity: 0; transform: translateY(0) scale(0.6); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-120px) scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .placeholder .heart, .sparkle { animation: none; }
  }
</style>
</head>
<body>

<main class="card" id="card">
  <div class="frame" id="frame">
    <div class="placeholder" id="placeholder">
      <div class="heart">♥</div>
      <div>add your first photo</div>
    </div>
    <img id="photo" alt="A photo of us">
  </div>

  <p class="caption" id="caption">Tap for another one.</p>

  <p class="footer" id="footer"></p>
  <p class="hint">tap anywhere for another</p>
</main>

<script>
  /* ============================================================
     EDIT THIS PART
     photos: file names inside the same folder as this page
     (for example "photos/1.jpg"). Each photo gets its own caption.
     ============================================================ */
  const PHOTOS = [
    { src: "photos/1.jpg", caption: "Our first photo together ♥" },
    { src: "photos/2.jpg", caption: "Still my favorite view." },
    { src: "photos/3.jpg", caption: "You, me, and way too much fun." },
    { src: "photos/4.jpg", caption: "Every day with you is a good one." }
  ];

  // Start date for the "together" counter. Format: YYYY-MM-DD
  const TOGETHER_SINCE = "2025-01-01";

  // Footer text. Leave empty to hide.
  const FOOTER = "";

  /* ============================================================ */

  const img = document.getElementById("photo");
  const placeholder = document.getElementById("placeholder");
  const captionEl = document.getElementById("caption");
  const footerEl = document.getElementById("footer");
  const card = document.getElementById("card");

  let last = -1;
  try { last = parseInt(localStorage.getItem("lastPhoto"), 10); } catch (e) {}

  function pickIndex() {
    if (PHOTOS.length <= 1) return 0;
    let i;
    do { i = Math.floor(Math.random() * PHOTOS.length); } while (i === last);
    return i;
  }

  function showPhoto(i) {
    last = i;
    try { localStorage.setItem("lastPhoto", String(i)); } catch (e) {}
    const p = PHOTOS[i];
    captionEl.classList.add("fade");
    img.classList.remove("show");
    setTimeout(() => {
      img.src = p.src;
      captionEl.textContent = p.caption;
      captionEl.classList.remove("fade");
    }, 250);
  }

  img.addEventListener("load", () => {
    placeholder.style.display = "none";
    img.classList.add("show");
  });
  img.addEventListener("error", () => {
    // No photo file yet: keep the placeholder so the page never looks broken.
    img.classList.remove("show");
    placeholder.style.display = "flex";
  });

  function daysTogether() {
    const start = new Date(TOGETHER_SINCE + "T00:00:00");
    const now = new Date();
    return Math.max(0, Math.floor((now - start) / 86400000));
  }

  function sparkleAt(x, y) {
    const s = document.createElement("span");
    s.className = "sparkle";
    s.textContent = "♥";
    s.style.left = x - 9 + "px";
    s.style.top = y - 12 + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2300);
  }

  card.addEventListener("click", (e) => {
    sparkleAt(e.clientX, e.clientY);
    showPhoto(pickIndex());
  });
  document.body.addEventListener("click", (e) => {
    if (!card.contains(e.target)) {
      sparkleAt(e.clientX, e.clientY);
      showPhoto(pickIndex());
    }
  });

  // Start with a random photo
  if (PHOTOS.length) {
    const first = pickIndex();
    last = first;
    img.src = PHOTOS[first].src;
    captionEl.textContent = PHOTOS[first].caption;
  }

  footerEl.textContent = FOOTER || (daysTogether() + " days together");
</script>
</body>
</html>
