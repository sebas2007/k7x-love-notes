<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>for you ♥</title>
<style>
  :root {
    --cream: #fdf6f0;
    --blush: #f4c6cf;
    --rose: #d9707f;
    --ink: #4a3b3f;
    --soft: #8c7377;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(circle at 15% 10%, #fde3e8 0, transparent 40%),
      radial-gradient(circle at 85% 90%, #f9d8c8 0, transparent 40%),
      var(--cream);
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    overflow-x: hidden;
  }
  #app {
    width: 100%;
    max-width: 420px;
  }
  .card {
    width: 100%;
    background: var(--card);
    border-radius: 28px;
    padding: 18px 18px 26px;
    box-shadow: 0 18px 40px rgba(120, 70, 80, 0.14), 0 2px 6px rgba(120, 70, 80, 0.08);
    text-align: center;
    animation: rise 0.9s ease both;
  }
  .hidden { display: none; }

  /* Photo screen */
  #screen1 { cursor: pointer; }
  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(160deg, var(--blush), #f9e4d9);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .frame img.show { opacity: 1; }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--rose);
    font-size: 15px;
    gap: 10px;
  }
  .placeholder .heart { font-size: 46px; animation: beat 1.6s ease-in-out infinite; }
  .caption {
    margin-top: 22px;
    min-height: 3.2em;
    font-size: 20px;
    line-height: 1.5;
    font-style: italic;
    color: var(--ink);
    transition: opacity 0.4s ease;
  }
  .caption.fade { opacity: 0; }
  .footer {
    margin-top: 18px;
    font-size: 13px;
    color: var(--soft);
    letter-spacing: 0.02em;
  }
  .hint {
    margin-top: 6px;
    font-size: 12px;
    color: #b9a3a7;
  }

  /* Other screens */
  .title { font-size: 24px; font-weight: normal; color: var(--rose); }
  .label { margin-top: 18px; font-size: 14px; color: var(--soft); letter-spacing: 0.02em; }
  .big { margin-top: 8px; font-size: 22px; line-height: 1.6; }
  .nav {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 26px;
  }
  .btn {
    background: var(--rose);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font: inherit;
    cursor: pointer;
  }
  .btn.ghost {
    background: transparent;
    color: var(--rose);
    border: 1px solid var(--rose);
  }
  textarea {
    width: 100%;
    margin-top: 16px;
    min-height: 110px;
    border-radius: 16px;
    border: 1px solid var(--blush);
    padding: 12px;
    font: inherit;
    color: var(--ink);
    background: #fffafb;
    resize: vertical;
    user-select: text;
  }

  /* Goodbye screen: envelope and letter */
  .envelope {
    position: relative;
    width: 260px;
    height: 170px;
    margin: 26px auto 0;
    background: #fff;
    border: 2px solid var(--blush);
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(120, 70, 80, 0.15);
    transition: transform 0.3s ease;
  }
  .envelope:hover { transform: translateY(-3px); }
  .envelope .flap {
    position: absolute;
    top: -2px;
    left: -2px;
    width: 0;
    height: 0;
    border-left: 130px solid transparent;
    border-right: 130px solid transparent;
    border-top: 90px solid var(--blush);
    transform-origin: top center;
    transition: transform 0.6s ease;
    z-index: 2;
  }
  .envelope.open .flap { transform: rotateX(180deg); }
  .envelope .seal {
    position: absolute;
    left: 50%;
    top: 60px;
    transform: translate(-50%, -50%);
    font-size: 30px;
    color: var(--rose);
    animation: beat 1.6s ease-in-out infinite;
    z-index: 3;
  }
  .letter {
    margin: 22px auto 0;
    padding: 22px 20px;
    background: #fffafb;
    border: 1px solid var(--blush);
    border-radius: 16px;
    font-size: 18px;
    line-height: 1.6;
    animation: rise 0.8s ease both;
  }
  .letter p { white-space: pre-line; }

  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 18px;
    color: var(--rose);
    opacity: 0;
    animation: float 2.2s ease-out forwards;
  }
  .bg-heart {
    position: fixed;
    bottom: -30px;
    color: var(--rose);
    opacity: 0.7;
    pointer-events: none;
    animation: rise-up 7s linear forwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes beat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    15%      { transform: translate(-50%, -50%) scale(1.12); }
    30%      { transform: translate(-50%, -50%) scale(1); }
    45%      { transform: translate(-50%, -50%) scale(1.08); }
  }
  @keyframes float {
    0%   { opacity: 0; transform: translateY(0) scale(0.6); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-120px) scale(1.1); }
  }
  @keyframes rise-up {
    from { transform: translateY(0); opacity: 0.7; }
    to   { transform: translateY(-110vh); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .placeholder .heart, .sparkle, .envelope .seal { animation: none; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- SCREEN 1: photos. The page shows 3 photos (the first one on load,
       then one per tap). The next tap opens the "Time together" screen. -->
  <main class="card screen" id="screen1">
    <div class="frame" id="frame">
      <div class="placeholder" id="placeholder">
        <div class="heart">♥</div>
        <div>add your first photo</div>
      </div>
      <img id="photo" alt="A photo of us">
    </div>

    <p class="caption" id="caption">Tap for another one.</p>

    <p class="footer" id="footer"></p>
    <p class="hint">tap the photo for another</p>
  </main>

  <!-- SCREEN 2: time together and time since we first talked -->
  <section class="card screen hidden" id="screen2">
    <h2 class="title">Time together</h2>
    <p class="label">Since we started dating</p>
    <p class="big" id="together"></p>
    <p class="label">Since we first talked</p>
    <p class="big" id="talked"></p>
    <div class="nav">
      <button class="btn ghost" onclick="showScreen('screen1')">Back</button>
      <button class="btn" onclick="showScreen('screen3')">Next</button>
    </div>
  </section>

  <!-- SCREEN 3: countdown to your next plan together -->
  <section class="card screen hidden" id="screen3">
    <h2 class="title" id="nextDateLabel"></h2>
    <p class="big" id="countdown"></p>
    <div class="nav">
      <button class="btn ghost" onclick="showScreen('screen2')">Back</button>
      <button class="btn" onclick="showScreen('screen4'); showQuestion();">Next</button>
    </div>
  </section>

  <!-- SCREEN 4: one question. She types an answer,
       it's saved on her phone and sent to yours. -->
  <section class="card screen hidden" id="screen4">
    <h2 class="title">Question of the day</h2>
    <p class="caption" id="question"></p>
    <textarea id="answer" placeholder="Type your answer ♥"></textarea>
    <button class="btn" onclick="saveAnswer()" style="margin-top: 12px;">Save & send</button>
    <p class="hint" id="saveMsg"></p>
    <div class="nav">
      <button class="btn ghost" onclick="showScreen('screen3')">Back</button>
      <button class="btn" onclick="finishQuestion()">Finish ♥</button>
    </div>
  </section>

  <!-- SCREEN 5: goodbye. Tap the envelope to open the letter. -->
  <section class="card screen hidden" id="screen5">
    <h2 class="title">Goodbye for now ♥</h2>
    <p class="hint">tap the envelope</p>
    <div class="envelope" id="envelope" onclick="openEnvelope()">
      <div class="flap"></div>
      <div class="seal">♥</div>
    </div>
    <div class="letter hidden" id="letter">
      <p id="goodbyeText"></p>
    </div>
    <div class="nav">
      <button class="btn ghost" onclick="showScreen('screen1')">Start over</button>
    </div>
  </section>

</div>

<script>
  /* ============================================================
     EDIT THIS PART
     ============================================================ */

  // Photos: file names inside the "photos" folder (lowercase, like "photos/1.jpg").
  // Each photo gets its own caption. Add more lines to show more photos.
  const PHOTOS = [
    { src: "photos/1.jpg", caption: "I really miss you I hope this makes you happy ♥" },
    { src: "photos/2.jpg", caption: "No idea what this photo is but i hope you like it." },
    { src: "photos/3.jpg", caption: "I cant wait to see you again. Hope you have a good day" },
    { src: "photos/4.jpg", caption: "I am so grateful to have you, love." }
  ];

  // How many photos she sees per visit (the first one on load counts as 1).
  // After that, the next tap opens "Time together".
  const MAX_PHOTOS = 3;

  // Date and time you started dating. Format: YYYY-MM-DDTHH:MM:SS (24-hour)
  const TOGETHER_SINCE = "2025-11-04T18:30:00"; // 6:30 PM, 11/4/25

  // Date and time you first talked. Same format.
  const FIRST_TALKED = "2025-09-09T20:28:00";

  // Footer text under the photo. Leave "" to show "X days together" instead.
  const FOOTER = "I love you";

  // Next plan together. Format: YYYY-MM-DDTHH:MM:SS
  const NEXT_DATE = new Date("2026-11-27T19:00:00");
  // Label shown above the countdown
  const NEXT_DATE_LABEL = "Our next movie night";

  // The one question for screen 4
  const QUESTION = "what has been the best experience we've had together in your opinion?";

  // Goodbye letter. Write your message here. Line breaks work.
  const GOODBYE_MESSAGE =
`Hi my love you are amazing. I am so grateful that you chose me and that I am able to live a life with you. You are so incredible and it makes me happy whenever I think of you. I hope you have an amazing day full of fun and happiness. I really miss you and I cant wait to see you.

I love you so much,
Sebastian ♥`;

  // ntfy topic for sending her answers to your phone.
  // Use a long, hard-to-guess name (anyone who knows it can read the messages).
  // Install the free ntfy app on your phone and subscribe to this same name.
  const NTFY_TOPIC = "elisesgithubthingy";

  /* ============================================================ */

  const img = document.getElementById("photo");
  const placeholder = document.getElementById("placeholder");
  const captionEl = document.getElementById("caption");
  const footerEl = document.getElementById("footer");
  const screen1 = document.getElementById("screen1");
  const togetherEl = document.getElementById("together");
  const talkedEl = document.getElementById("talked");
  const countdownEl = document.getElementById("countdown");
  const nextDateLabelEl = document.getElementById("nextDateLabel");
  const questionEl = document.getElementById("question");
  const answerEl = document.getElementById("answer");
  const saveMsgEl = document.getElementById("saveMsg");
  const envelopeEl = document.getElementById("envelope");
  const letterEl = document.getElementById("letter");
  const goodbyeTextEl = document.getElementById("goodbyeText");

  goodbyeTextEl.textContent = GOODBYE_MESSAGE;

  // Remembers the last photo so the same one doesn't repeat right away
  let last = -1;
  try { last = parseInt(localStorage.getItem("lastPhoto"), 10); } catch (err) {}

  // Counts the photos she has seen on this visit (resets each time the page opens)
  let photosSeen = 1; // the first photo counts as 1

  function pickIndex() {
    if (PHOTOS.length <= 1) return 0;
    let i;
    do { i = Math.floor(Math.random() * PHOTOS.length); } while (i === last);
    return i;
  }

  function showPhoto(i) {
    last = i;
    try { localStorage.setItem("lastPhoto", String(i)); } catch (err) {}
    const p = PHOTOS[i];
    captionEl.classList.add("fade");
    img.classList.remove("show");
    setTimeout(() => {
      img.src = p.src;
      captionEl.textContent = p.caption;
      captionEl.classList.remove("fade");
    }, 250);
  }

  img.addEventListener("load", () => {
    placeholder.style.display = "none";
    img.classList.add("show");
  });
  img.addEventListener("error", () => {
    // No photo file yet: keep the placeholder so the page never looks broken.
    img.classList.remove("show");
    placeholder.style.display = "flex";
  });

  function daysTogether() {
    return Math.max(0, Math.floor((new Date() - new Date(TOGETHER_SINCE)) / 86400000));
  }

  function sparkleAt(x, y) {
    const s = document.createElement("span");
    s.className = "sparkle";
    s.textContent = "♥";
    s.style.left = x - 9 + "px";
    s.style.top = y - 12 + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2300);
  }

  // Switches between screens. Only the screen with this id stays visible.
  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  // Every tap on the photo screen comes here
  function onPhotoTap(e) {
    sparkleAt(e.clientX, e.clientY);
    if (photosSeen < MAX_PHOTOS) {
      photosSeen++;
      showPhoto(pickIndex());
    } else {
      showScreen("screen2");
    }
  }
  screen1.addEventListener("click", onPhotoTap);

  // Turns a start date and time into "X days, X hours, X minutes, X seconds"
  function formatSince(startString) {
    let diff = Math.max(0, Math.floor((new Date() - new Date(startString)) / 1000));
    const days = Math.floor(diff / 86400); diff %= 86400;
    const hours = Math.floor(diff / 3600); diff %= 3600;
    const mins = Math.floor(diff / 60);
    const secs = diff % 60;
    return `${days} days, ${hours} hours, ${mins} minutes, ${secs} seconds`;
  }

  function updateTogether() {
    togetherEl.textContent = formatSince(TOGETHER_SINCE);
    talkedEl.textContent = formatSince(FIRST_TALKED);
  }

  // Countdown to NEXT_DATE
  function updateCountdown() {
    nextDateLabelEl.textContent = NEXT_DATE_LABEL;
    let diff = Math.floor((NEXT_DATE - new Date()) / 1000);
    if (diff <= 0) {
      countdownEl.textContent = "It's today! ♥";
      return;
    }
    const days = Math.floor(diff / 86400); diff %= 86400;
    const hours = Math.floor(diff / 3600); diff %= 3600;
    const mins = Math.floor(diff / 60);
    const secs = diff % 60;
    countdownEl.textContent = `${days} days, ${hours} hours, ${mins} minutes, ${secs} seconds to go`;
  }

  // Shows the question and her saved answer
  function showQuestion() {
    questionEl.textContent = QUESTION;
    let saved = "";
    try { saved = localStorage.getItem("answer") || ""; } catch (err) {}
    answerEl.value = saved;
    saveMsgEl.textContent = "";
  }

  // Saves her answer on her phone, then sends the question and answer to yours
  async function saveAnswer() {
    const text = answerEl.value.trim();
    if (!text) {
      saveMsgEl.textContent = "Type something first ♥";
      return;
    }
    try { localStorage.setItem("answer", text); } catch (err) {}

    saveMsgEl.textContent = "Sending...";
    try {
      const res = await fetch("https://ntfy.sh/" + NTFY_TOPIC, {
        method: "POST",
        headers: { "Title": "Question of the day" },
        body: QUESTION + "\n\n" + text
      });
      saveMsgEl.textContent = res.ok
        ? "Sent to your phone ♥"
        : "Saved here, but it didn't send. Try again.";
    } catch (err) {
      saveMsgEl.textContent = "Saved here, but it didn't send. Check the connection.";
    }
  }

  // After the question, go to the goodbye screen
  function finishQuestion() {
    showScreen("screen5");
    startHearts();
  }

  // Opens the envelope, then shows the letter
  function openEnvelope() {
    if (envelopeEl.classList.contains("open")) return;
    envelopeEl.classList.add("open");
    setTimeout(() => {
      envelopeEl.classList.add("hidden");
      letterEl.classList.remove("hidden");
    }, 650);
  }

  // Floating hearts on the goodbye screen
  let heartsTimer = null;
  function spawnHeart() {
    const h = document.createElement("span");
    h.className = "bg-heart";
    h.textContent = Math.random() < 0.5 ? "♥" : "♡";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (14 + Math.random() * 16) + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 7000);
  }
  function startHearts() {
    if (heartsTimer) return;
    heartsTimer = setInterval(spawnHeart, 600);
  }

  // Update the counters every second
  setInterval(() => { updateTogether(); updateCountdown(); }, 1000);
  updateTogether();
  updateCountdown();
  showQuestion();

  // Start with a random photo (this is photo 1 of 3)
  if (PHOTOS.length) {
    const first = pickIndex();
    last = first;
    img.src = PHOTOS[first].src;
    captionEl.textContent = PHOTOS[first].caption;
  }

  footerEl.textContent = FOOTER || (daysTogether() + " days together");
</script>
</body>
</html>
